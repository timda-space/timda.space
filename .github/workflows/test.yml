# Tests on every pull request and push: the parser, the verifier and the timda
# tool, with real ssh-keygen signatures and real age encryption.
name: test

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install age (for the sealed-mail tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: npm test
